# Домены, которые нужно показывать даже без входов
# Укажи их через запятую без пробелов или перенеси строку через обратный слеш
# Пример domains=play.example.org,mc.example.org
domains=

# Добавлять домены из раздела forced-hosts в velocity.toml
import-forced-hosts=true

# Число доменов или игроков на странице от 1 до 30
page-size=8

# Статистика хранится в domains.db рядом с этим файлом
# Уникальные игроки считаются по нику без учёта регистра
# Вход считается после первого успешного подключения к серверу за сессию
# Смена сервера внутри прокси не добавляет вход
# Доступ к командам проверяется через право domain.use
# Звёздочка из LuckPerms Velocity учитывается стандартной проверкой прав
